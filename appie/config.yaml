name: HAppie
version: "0.6.0"
slug: appie
description: Albert Heijn-boodschappenlijst in Home Assistant, met sync naar de Appie-app
url: https://github.com/emile-bodin/HAppie
image: ghcr.io/emile-bodin/{arch}-happie
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:cart
panel_title: HAppie
homeassistant_api: true
options:
  todo_entity: todo.boodschappen
  sync_interval: 60
  auto_match_products: false
  bonus_notifications: true
  notify_service: ""
  week_budget: 0
  log_level: info
schema:
  todo_entity: str
  sync_interval: int(15,3600)
  auto_match_products: bool
  bonus_notifications: bool
  notify_service: str?
  week_budget: float(0,)
  log_level: list(debug|info|warning|error)
