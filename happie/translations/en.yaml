configuration:
  todo_entity:
    name: To-do list
    description: The Home Assistant to-do entity that is synced with your AH list (e.g. todo.boodschappen). Create it via Settings > Devices & services > Add integration > Local To-do.
  sync_interval:
    name: Sync interval (seconds)
    description: How often the AH list is polled (15 to 3600), or 0 for manual only. Changes in Home Assistant are pushed immediately. You can also set this in the panel, under your profile › Automatisch.
  auto_match_products:
    name: Auto-match products
    description: When an item is added in Home Assistant (e.g. by voice), search the best matching AH product and add that instead of free text.
  bonus_notifications:
    name: Bonus notifications
    description: Notify when something on your list, or something you buy often, is in the bonus (once per offer).
  notify_service:
    name: Notify service
    description: Optional, e.g. notify.mobile_app_phone to also send notifications to your phone. Empty = Home Assistant notification only.
  week_budget:
    name: Weekly budget (EUR)
    description: Optional. Notify when what you spent at AH this week plus your shopping list goes over this amount. 0 = off.
  month_budget:
    name: Monthly budget (EUR)
    description: Optional. The Uitgaven page shows how much is left this month, including your shopping list, and you get a notification when you go over. 0 = off.
  log_level:
    name: Log level
