name: Fout melden
description: Iets werkt niet zoals het hoort in HAppie.
title: "[Fout] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Bedankt voor je melding! Let op: **plak nooit tokens, wachtwoorden, e-mailadressen of je adres** in dit formulier. Haal die ook uit logregels weg.

        HAppie gebruikt de onofficiële AH-API. Werkt iets plotseling niet meer, dan kan AH iets veranderd hebben; meld het dan ook gerust.
  - type: textarea
    id: wat
    attributes:
      label: Wat gaat er mis?
      description: Beschrijf kort wat er gebeurt.
    validations:
      required: true
  - type: textarea
    id: verwacht
    attributes:
      label: Wat had je verwacht?
    validations:
      required: true
  - type: textarea
    id: stappen
    attributes:
      label: Hoe kunnen we het nadoen?
      description: De stappen om de fout te laten zien.
      placeholder: |
        1. Open het paneel
        2. Ga naar ...
        3. Klik op ...
    validations:
      required: false
  - type: dropdown
    id: onderdeel
    attributes:
      label: Onderdeel
      options:
        - Synchronisatie met de to-do-lijst
        - Zoeken
        - Ontdekken
        - Bestellingen
        - Voorraad
        - Uitgaven en budget
        - Sensoren of meldingen
        - Inloggen bij AH
        - Installeren of bijwerken
        - Iets anders
    validations:
      required: true
  - type: input
    id: versie
    attributes:
      label: Versie van HAppie
      description: Te vinden bij Instellingen → Apps → HAppie.
      placeholder: "0.7.1"
    validations:
      required: true
  - type: input
    id: ha-versie
    attributes:
      label: Versie van Home Assistant
      description: Te vinden bij Instellingen → Over.
      placeholder: "2026.11.0"
    validations:
      required: true
  - type: dropdown
    id: apparaat
    attributes:
      label: Waar gebruik je het paneel?
      options:
        - Browser op de computer
        - Browser op telefoon of tablet
        - Home Assistant-app op telefoon of tablet
        - Niet van toepassing
  - type: textarea
    id: logs
    attributes:
      label: Logboek
      description: Relevante regels uit het logboek (Instellingen → Apps → HAppie → Logboek). Haal persoonlijke gegevens weg.
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Verder nog iets?
      description: Schermafbeeldingen of andere informatie die helpt.
  - type: checkboxes
    id: privacy
    attributes:
      label: Controle
      options:
        - label: Ik heb geen tokens, wachtwoorden of persoonlijke gegevens geplakt.
          required: true
