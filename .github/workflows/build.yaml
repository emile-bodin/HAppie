name: Tests en build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install aiohttp
      - name: Tests draaien
        run: |
          set -e
          for t in tests/test_*.py; do
            echo "== $t"
            python "$t"
          done

  lint:
    name: App-configuratie controleren
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: frenck/action-addon-linter@v2
        with:
          path: "./appie"

  build:
    name: Image ${{ matrix.arch }}
    needs: [tests, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, amd64]
    steps:
      - uses: actions/checkout@v4

      - name: Inloggen bij GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # pull requests: alleen bouwen (--test), niets publiceren
      - name: Bouwen${{ github.event_name != 'pull_request' && ' en publiceren' || '' }}
        uses: home-assistant/builder@2024.08.2
        with:
          args: |
            ${{ github.event_name == 'pull_request' && '--test' || '' }} \
            --${{ matrix.arch }} \
            --target /data/appie \
            --image "{arch}-happie" \
            --docker-hub "ghcr.io/${{ github.repository_owner }}" \
            --addon
